name: Documentation CI

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**/*.md'

jobs:
  lint-markdown:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          globs: '**/*.md'

  check-links:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline "**/*.md"
